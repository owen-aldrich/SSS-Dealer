<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Peran | SSS+Dealer</title>
    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="css/admin.css?v=1">
</head>

<body>
    <div class="role-wrap">
        <div class="role-card">
            <p class="overline">SSS+DEALER / PERAN</p>
            <h1>Masuk sebagai siapa hari ini?</h1>
            <p class="role-desc">Pilih pengalaman yang sesuai. Akses admin hanya untuk akun dengan peran administrator.</p>

            <div class="role-options">
                <button type="button" class="role-option" id="asBuyer">
                    <h3>Pembeli</h3>
                    <p>Jelajahi koleksi, simpan favorit, bandingkan, dan pesan test drive.</p>
                </button>
                <button type="button" class="role-option" id="asAdmin">
                    <h3>Administrator</h3>
                    <p>Kelola mobil, pemesanan test drive, dan lead pembeli.</p>
                </button>
            </div>

            <p class="role-desc" id="roleNote"></p>
        </div>
    </div>

    <script src="js/nav-auth.js?v=4"></script>
    <script src="js/role.js?v=1"></script>
</body>

</html>
