<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | SSS+Dealer</title>

    <link rel="stylesheet" href="css/style.css?v=4">
    <link rel="stylesheet" href="css/home.css?v=5">
    <link rel="stylesheet" href="css/auth.css?v=4">
</head>

<body class="home">

    <header>
        <nav class="site-nav">
            <a href="index.html" class="brand-word">SSS<span class="plus">+</span><span class="suffix">Dealer</span></a>
            <ul class="nav-menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="cars.html">Koleksi</a></li>
                <li><a href="compare.html">Bandingkan</a></li>
                <li><a href="account.html">Favorit</a></li>
            </ul>
            <div class="nav-actions">
                <a href="signin.html" class="btn btn-outline nav-account-link">
                    <img src="images/icons/user-round.svg" alt="">
                    Akun
                </a>
            </div>
        </nav>
    </header>

    <main>
        <div class="auth-wrapper">
            <div class="auth-card">
                <p class="auth-subtitle">GABUNG SSS+DEALER</p>
                <h1>Buat Akun</h1>

                <div id="formMessage" class="form-message"></div>

                <form id="signupForm">

                    <div class="form-group">
                        <label for="fullname">NAMA LENGKAP</label>
                        <input type="text" id="fullname" required>
                    </div>

                    <div class="form-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="username">USERNAME</label>
                        <input type="text" id="username" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">KATA SANDI</label>
                            <input type="password" id="password" required minlength="6">
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">KONFIRMASI KATA SANDI</label>
                            <input type="password" id="confirmPassword" required minlength="6">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">USIA (OPSIONAL)</label>
                            <input type="number" id="age" min="17" max="100">
                        </div>

                        <div class="form-group">
                            <label for="address">ALAMAT (OPSIONAL)</label>
                            <input type="text" id="address">
                        </div>
                    </div>

                    <button type="submit" class="auth-submit">DAFTAR SEKARANG</button>

                </form>

                <p class="auth-switch">
                    Sudah punya akun? <a href="signin.html">Masuk di sini</a>
                </p>
            </div>
        </div>
    </main>

    <script src="js/auth.js?v=4"></script>
    <script src="js/nav-auth.js?v=4"></script>

</body>

</html>
